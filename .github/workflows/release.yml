# Cuts a release of this repo, by hand: run this workflow ("Run workflow" in the
# Actions tab) when you want a new version. It never runs on its own.
#
# What it does:
#   1. Refuses to start if a release branch or an open release pull request exists.
#   2. From main, .github/scripts/release.sh --branch writes the next version
#      (breaking: major, feat: minor, otherwise patch), the CHANGELOG.md section,
#      removes the release notes in changes/ and commits it on release/vX.Y.Z.
#   3. Runs the release's own tests (.github/scripts/*.test.sh) on that branch.
#      A release changes no plugin code, and that code already passed the full
#      suite on its own pull request. If anything fails the run ends red and
#      nothing was pushed: main and the release notes are untouched.
#   4. .github/scripts/release-push.sh creates the branch on GitHub at main and
#      commits the same changes on it through GitHub's API, then a pull request
#      to main is opened with the changelog section as its description, labelled
#      no-changelog.
#   5. You review and merge it with "Squash and merge". Only then do the release
#      notes leave main.
#   6. publish-release.yml tags the merged commit and publishes the GitHub Release.
# With no release notes waiting in changes/, it ends without doing anything.
#
# main only accepts commits with a verified signature, and a commit made with
# `git commit` and the token of the run cannot be signed. So the commit made in
# step 2 is never pushed: GitHub creates the one on the branch and signs it.
#
# No secret is used, only the token of the run (GITHUB_TOKEN). One setting of the
# repository must be on, because the pull request is opened by Actions: Settings >
# Actions > General > Workflow permissions > "Allow GitHub Actions to create and
# approve pull requests". If it is off, the run says so and removes the branch it
# pushed.
#
# The checks of a pull request opened with GITHUB_TOKEN do not start on their own:
# GitHub holds them as "awaiting approval" until a maintainer approves them.
# changelog-check and tests both skip this pull request by its author and branch,
# so once the held runs are approved both required checks pass without running
# the suite again. The cost: a change merged to main around the tests (an admin
# bypass) is no longer caught here; the push to main still runs the full suite.
#
# Run it from main (the job does nothing from another branch). It runs on macOS,
# like tests.yml: the scripts have only ever been run there.
name: release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# The label no-changelog is best effort (see release-pr.sh), so pull-requests: write
# is all it needs besides the contents of the branch.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.repository == 'lbecjx/workflow-dev' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-towncrier
      - name: Check that no release is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-guard.sh
      - uses: ./.github/actions/bot-identity
      - name: Write the release on its own branch
        id: release
        run: .github/scripts/release.sh --branch
      - name: Run the tests on the release branch
        if: steps.release.outputs.released == 'true'
        run: bash .github/scripts/run-tests.sh .github/scripts
      - name: Commit the release on its branch through GitHub
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: .github/scripts/release-push.sh
      - name: Open the release pull request
        id: pr
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ steps.release.outputs.branch }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: .github/scripts/release-pr.sh
      - name: Say what happened
        if: always()
        env:
          RELEASED: ${{ steps.release.outputs.released }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "Release pull request: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RELEASED" = "false" ]; then
            echo "No release notes are waiting in changes/: nothing to release." >> "$GITHUB_STEP_SUMMARY"
          fi
