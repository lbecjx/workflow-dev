# A pull request must carry its own release note as a fragment in changes/
# (changes/<story>.<feat|fix|breaking|misc>.md); it does not touch CHANGELOG.md
# or the version in plugin.json, which the release job writes after the merge.
# The label no-changelog skips the check, and so does the release pull request
# that release.yml opens: it removes the release notes instead of adding one. That
# pull request is recognized by who opened it (github-actions[bot]), its branch
# (release/v...) and its repository, all known when it is opened. Its label cannot
# be relied on: GitHub holds the checks of a pull request opened with GITHUB_TOKEN
# until a maintainer approves them, and the label is added only after it is opened.
# A skipped job counts as passed, also for a required check.
#
# A renamed fragment counts as changed (the R in the filter), so renaming one to
# another type or an invalid name is checked like a new one.
#
# core.quotePath=false keeps a name with accents readable, so it is still seen as
# a path under changes/ and rejected instead of being skipped.
#
# Set up by hand on the remote, since a workflow file cannot do it:
#   - create the no-changelog label;
#   - make this check required on main, otherwise a red check blocks nothing.
name: changelog-check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  fragment:
    if: >-
      ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog')
      && !(github.event.pull_request.user.login == 'github-actions[bot]'
      && startsWith(github.head_ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the release note fragments of this pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git -c core.quotePath=false diff --name-only --diff-filter=AMR "origin/$BASE_REF...HEAD" -- changes/ \
            | .github/scripts/check-changes.sh
