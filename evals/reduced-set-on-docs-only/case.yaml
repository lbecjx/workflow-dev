schema_version: "1.1"
name: reduced-set-on-docs-only
description: >
  Guard for the reduced-set gate (validate/SKILL.md Step 3) with the Algorithmic
  Integrity dimension in the picture (WD-0034). On a docs-only diff — no real
  logic — /workflow-dev:validate must run the reduced set and must not report the
  judgment dimensions, Algorithmic Integrity included, as run/passed. If a future
  edit makes the gate spawn that dimension for a docs-only change, this should
  start failing. It also guards the Git History Disclosure SKIP (WD-0076): a
  release-note fragment committed before the diff, and not in it, must not be
  reviewed.
tags: [algorithmic-integrity, reduced-set, git-history-disclosure, regression]
context:
  scaffold_script: fixture.sh
