schema_version: "1.1"
name: complexity-simple-runs-security
description: >
  Guard for the story complexity level added in WD-0084. The active story's
  Decisions record `Complexity: simple` and `Validations for simple: none`, and
  the diff is documentation only (the same shape as reduced-set-on-docs-only,
  where no level means Security is SKIP). For a `simple` story,
  /workflow-dev:validate must still run Security, and skip every unlisted
  judgment dimension and the adversarial pass. If a future edit drops Security
  for `simple`, or runs dimensions the judge did not list, this should start
  failing.
tags: [complexity, regression]
context:
  scaffold_script: fixture.sh
