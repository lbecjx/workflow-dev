schema_version: "1.1"
name: history-disclosure-fragment-passes
description: >
  Guard for Git History Disclosure on release-note fragments (WD-0076). The
  diff rewrites one fragment under changes/ into a short, net-effect note.
  /workflow-dev:validate must review it and pass it. A "not touched" SKIP
  means the fragment was never read, which is the regression this case guards.
tags: [git-history-disclosure, release-notes, regression]
context:
  scaffold_script: fixture.sh
