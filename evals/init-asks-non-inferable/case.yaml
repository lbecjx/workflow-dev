schema_version: "1.1"
name: init-asks-non-inferable
description: >
  Guard for WD-0083, AC3 and AC4 in a step-by-step run. The story's one
  criterion asks for "the most important contacts first", and nothing in the
  story, REPO.md, the code or the history says what makes a contact important:
  the CSV has both `last_contact` and `deals_closed`, and either ordering is a
  reasonable product call. That is a doubt the evidence cannot settle (a
  product decision). init must put the question to the human, or record it as
  an open question, and must not pick an ordering on its own. The eval runner
  is non-interactive (`claude -p`): an ask surfaces as prose and the ask-
  question tool is never answered, so the run counts as unattended
  (references/inference-first.md, "A doubt you cannot infer"). The graders
  read what the run says and does, never an answer the human gave.
tags: [inference-first, init, regression]
context:
  scaffold_script: fixture.sh
