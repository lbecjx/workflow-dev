schema_version: "1.1"
name: history-disclosure-fragment-warns
description: >
  Guard for Part 12.4 on release-note fragments (WD-0076). The diff rewrites
  one fragment under changes/ into a long, step-by-step account of the
  implementation with nothing sensitive in it. /workflow-dev:validate must
  report a length WARN for that fragment, not a PASS, a SKIP, or a blocking
  FAIL.
tags: [git-history-disclosure, release-notes, regression]
context:
  scaffold_script: fixture.sh
---
max_turns: 60
timeout_seconds: 1800
# `allowed_tools` are Claude Code tool names — the vocabulary the `claude plugin
# eval` runner expects.
allowed_tools: [Read, Glob, Grep, Bash, Skill, Agent, AskUserQuestion]
